[project]
name = "job-radar"
version = "0.1.0"
description = "Crawler de vagas que pontua contra um perfil e publica no Discord"
requires-python = ">=3.12"
dependencies = []  # stdlib apenas: roda sem instalar nada

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
job-radar = "job_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
