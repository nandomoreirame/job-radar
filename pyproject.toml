[project]
name = "job-radar"
version = "0.1.0"
description = "Crawler de vagas que pontua contra um perfil e publica no Discord"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []  # stdlib apenas: roda sem instalar nada

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: license SPDX (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
