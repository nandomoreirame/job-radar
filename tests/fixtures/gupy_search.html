bsp;Completar el inventario de tablas fuente requeridas para Bronze.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Apoyar la remediación de tablas para habilitar carga incremental.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Diseñar y construir modelos de Silver y Gold.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Trabajar de forma coordinada bajo un único estándar arquitectónico, evitando duplicar criterios.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Implementar y mantener tests de dbt bajo los estándares y criterios de severidad definidos.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Implementar la validación de volumetría y reconciliación de datos en las capas Bronze, Silver y Gold.Requisitos y calificacionesRequisitos obligatorios·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;3+ años de experiencia en ingeniería de datos, ETL o integración de datos.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;SQL avanzado, preferentemente T-SQL / SQL Server.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Experiencia con Microsoft Fabric o Azure Data Factory.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Experiencia con procesos de ingesta e integración desde múltiples fuentes heterogéneas.·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Experiencia escribiendo o manteniendo pruebas automatizadas de calidad de datos (dbt tests, Great Expectations, o validaciones equivalentes en SQL).·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Familiaridad conceptual y aplicada con estrategias de carga incremental (CDC, watermarking, columnas ROWVERSION o de auditoría).·\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Experiencia con control de versiones Git.","careerPageName":"Stefanini Latam","careerPageLogo":"https://attachments.gupy.io/production/companies/54256/career/114440/images/2025-06-18_21-01_companyLogoUrl.png","careerPageUrl":"","type":"vacancy_type_associate","publishedDate":"2026-09-09T18:38:32.737Z","workplaceType":"hybrid","city":"Lima","state":"","jobUrl":"https://stefaninilatam.gupy.io/job/eyJqb2JJZCI6MTI0NDc1NjIsInNvdXJjZSI6Imd1cHlfcG9ydGFsIn0=?jobBoardSource=gupy_portal","disabilities":true},{"id":12378158,"name":"Data Engineer","applicationDeadline":"2026-10-30T00:00:00.000Z","description":"🚀 ¡Únete a Stefanini! | Data Engineer GCP – Semi SeniorEn Stefanini estamos buscando un/a Data Engineer Semi Senior para participar en un proyecto enfocado en la evolución y migración de procesos de datos hacia Google Cloud Platform (GCP).Buscamos un perfil hands-on que pueda participar desde el levantamiento y entendimiento de la información hasta la construcción e implementación de soluciones de datos.Responsabilidades y atribuciones🔹 ¿Cuáles serán tus principales desafíos?Participar en la migración de modelos y estructuras de datos hacia GCP.Trabajar con BigQuery y Dataflow.Desarrollar procesos de ingesta, transformación y almacenamiento de datos.Levantar campos, incorporar información y construir tablas.Participar en la transformación de procesos y cálculos de comisiones actualmente gestionados en Excel hacia GCP.Desarrollar pipelines de datos automatizados y escalables.Contribuir a la gobernanza, seguridad y trazabilidad de la información.Colaborar con equipos técnicos y de negocio para implementar soluciones alineadas con los objetivos del proyecto.Requisitos y calificacionesExperiencia en ingeniería de datos y conocimientos en:✅ Google Cloud Platform (GCP) ✅ BigQuery ✅ Dataflow ✅ Ingesta y transformación de datos ✅ Desarrollo de pipelines ✅ Modelos, tablas y estructuras de datos ✅ Excel como fuente o insumo de información y cálculos.Informaciones adicionales}beneficios Stefanini ","careerPageName":"Stefanini Latam","careerPageLogo":"https://attachments.gupy.io/production/companies/54256/career/114440/images/2025-06-18_21-01_companyLogoUrl.png","careerPageUrl":"","type":"vacancy_type_effective","publishedDate":"2026-09-02T22:01:17.691Z","workplaceType":"hybrid","city":"Santiago","state":"","jobUrl":"https://stefaninilatam.gupy.io/job/eyJqb2JJZCI6MTIzNzgxNTgsInNvdXJjZSI6Imd1cHlfcG9ydGFsIn0=?jobBoardSource=gupy_portal","disabilities":true},{"id":12220389,"name":"Data Platform Engineer ","applicationDeadline":"2026-10-20T00:00:00.000Z","description":"Modelo de trabalho:📍\u0026nbsp;Modelo de trabalho 100% remotoSobre o time:O Time de Dados é o alicerce estratégico que transforma dados brutos em inteligência competitiva. Atuamos na fronteira entre tecnologia e negócio, garantindo que a informação seja confiável, acessível e performática e, agora, a fundação de dados para a nossa próxima fronteira: a inteligência artificial generativa aplicada ao negócio. Nosso desafio é construir uma camada de dados robusta que sirva de combustível para que os times de Analytics e Data Science extraiam o máximo valor da nossa plataforma, suportando o crescimento acelerado da companhia com governança e eficiência.Desafios da posição:Sua missão será ser a referência técnica em engenharia de dados dentro da GCP, responsável pela espinha dorsal que sustenta todo o consumo analítico da empresa. Você vai arquitetar e implementar pipelines de ingestão e processamento — batch e near real time — sobre BigQuery, definindo os padrões de orquestração, versionamento e infraestrutura como código que o restante do time passa a seguir. Não se trata apenas de entregar pipelines: é desenhar as fundações, os contratos de dados e as ferramentas internas que tornam cada nova fonte e cada novo caso de uso mais barato de construir do que o anterior.\nO desafio central é elevar a maturidade da nossa plataforma de dados e preparar o terreno para a nossa estratégia de IA, garantindo confiabilidade, observabilidade e previsibilidade de custo em escala. Você vai construir a camada de base sobre a qual analytics engineers, cientistas de dados e agentes de IA operam com autonomia — com linhagem rastreável, frescor monitorado e acesso governado. Ao final, seja um dashboard, um modelo ou um agente autônomo consumindo os dados, a fonte da informação será única, performática e confiável.Responsabilidades e atribuiçõesSeu dia a dia na Conta Simples:Arquitetar e manter a plataforma de dados na GCP, definindo os padrões de ingestão, processamento e orquestração que sustentam todo o consumo analítico da empresa — de dashboards a agentes de IA.Construir e evoluir pipelines de ingestão batch e near real time a partir de bancos transacionais, APIs e eventos, garantindo que novas fontes entrem no BigQuery de forma padronizada e com esforço decrescente.Estabelecer contratos de dados e governança de schema, protegendo as camadas de consumo de quebras em upstream e tornando explícito o acordo entre quem produz e quem consome dados.Implementar observabilidade de dados ponta a ponta — linhagem, frescor, volume e alertas —, para que falhas sejam detectadas pelo time antes de chegarem ao negócio.Tratar infraestrutura como produto, versionando recursos em Terraform, mantendo pipelines de CI/CD e reduzindo o caminho entre uma ideia e um dado disponível em produção.Otimizar performance e custo no BigQuery em escala, definindo estratégias de particionamento, clusterização, reservas e monitoramento de consumo para que o crescimento da empresa não vire crescimento proporcional de custo.Garantir segurança e privacidade dos dados, implementando controles de acesso, mascaramento e políticas de retenção compatíveis com um ambiente financeiro regulado.Atuar como referência técnica e mentor do time, conduzindo decisões de arquitetura, revisões de código e a disseminação de boas práticas de engenharia aplicadas a dados.Colaborar diretamente com Analytics Engineering e Data Science, oferecendo a base e as ferramentas para que essas pessoas trabalhem com autonomia, sem depender de você para cada nova entrega.\n\n\n\n\n\n\n\nRequisitos e qualificaçõesO que esperamos de você:Senioridade técnica para tomar decisões de arquitetura com trade-offs explícitos e influenciar times além do seu próprio.Domínio em SQL: capacidade de escrever e depurar queries complexas, performáticas e legíveis.Experiência sólida em Python aplicado a dados: construção de pipelines, integrações com APIs e ferramentas internas — com testes e código de qualidade de produção.Ecossistema GCP: vivência prática com BigQuery, Cloud Storage, Pub/Sub e serviços de processamento (Dataflow, Dataproc ou equivalentes).Orquestração: experiência com Airflow/Cloud Composer, incluindo idempotência, backfills e gestão de dependências.Infraestrutura como código e cultura de engenharia: Terraform, Git/GitHub, CI/CD e Code Review como prática cotidiana.Modelagem de dados: entendimento de Data Warehousing e modelagem dimensional o suficiente para desenhar camadas que sirvam bem a quem consome.Experiência com Dataform ou dbt e com o ciclo de vida de transformações versionadas.Confiabilidade e qualidade: prática em testes automatizados de dados, monitoramento e resposta a incidentes.\n\n\n\n\n\n\n\nSerá diferencial se você tiver:Experiência com processamento em streaming (Pub/Sub, Dataflow, Kafka ou Flink) em cenários de baixa latência.Vivência com arquiteturas modernas de plataforma de dados: data mesh, catálogo e discovery, self-service para times de negócio.Conhecimento de arquitetura de dados para RAG (Retrieval-Augmented Generation): estruturação de dados e metadados para otimizar a recuperação e o contexto de informações por LLMs.Experiência com Kubernetes, containers e práticas de SRE aplicadas a pipelines de dados.Vivência no setor financeiro ou fintechs, incluindo requisitos de compliance e auditoria.\n\n\n\nInformações adicionaisDá uma olhada (em alguns) dos benefícios de ser Simpler:🏥 Plano de saúde (amplitude nacional) sem custo de mensalidade e coparticipação para os nossos #Simplers e até +2 dependentes legai
